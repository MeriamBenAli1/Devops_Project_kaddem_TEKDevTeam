version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: kaddem_db
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql

  app-kaddem:
    depends_on:
      - mysqldb
    image: dhakerrhimi/kaddem:latest
    restart: on-failure
    ports:
      - 8089:8089
    environment:
      SPRING_APPLICATION_JSON: '{
        "server.servlet.context-path" : "/kaddem",
        "server.port" : "8089",
        "spring.datasource.url" : "jdbc:mysql://mysqldb:3306/kaddem_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8",
        "spring.datasource.username" : "root",
        "spring.datasource.password" : "",
        "spring.jpa.hibernate.ddl-auto" : "update",
        "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL5Dialect"
      }'
    stdin_open: true
    tty: true

volumes:
  db:
